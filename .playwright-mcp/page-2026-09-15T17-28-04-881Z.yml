- generic [active] [ref=e1]: "{\"@odata.count\":7,\"@search.coverage\":null,\"@search.facets\":{\"BranchId\":[{\"type\":0,\"from\":null,\"to\":null,\"value\":303704,\"count\":7}],\"Theme\":[{\"type\":0,\"from\":null,\"to\":null,\"value\":\"ThoughtfulLearning\",\"count\":7}],\"CategoryIds\":[{\"type\":0,\"from\":null,\"to\":null,\"value\":\"8776\",\"count\":5},{\"type\":0,\"from\":null,\"to\":null,\"value\":\"8784\",\"count\":1}],\"BenefitNames\":[{\"type\":0,\"from\":null,\"to\":null,\"value\":\"Free Food\",\"count\":2}]},\"value\":[{\"id\":\"12736346\",\"institutionId\":5435,\"organizationId\":323474,\"organizationIds\":[\"323474\",\"331247\",\"418713\",\"425942\"],\"branchId\":303704,\"branchIds\":[\"303704\",\"178668\"],\"organizationName\":\"Instructional Innovation & Technology\",\"organizationProfilePicture\":\"5a644c40-169d-4b1a-9a82-0e39c9cc745285e93afb-ac5a-4429-9d79-f88cecdb09f2.png\",\"organizationNames\":[\"Instructional Innovation & Technology\",\"POUNCE Rewards Program\",\"Research Computing/ARCTIC\",\"Community of Students in Math, Innovation, and Computing \"],\"name\":\"Data Analysis & Statistical Methods Lightening Talks Session - SCD Conference Session\",\"description\":\"<p>View a series of three-minute lightening talks by university researchers on&nbsp;<strong>Data Analysis &amp; Statistical Methods</strong>&nbsp;at the&nbsp;<a href=\\\"https://arctic.gsu.edu/training/scd/\\\">Science and Cyberinfrastructure for Discovery</a>&nbsp;(SCD) conference.</p>\\r\\n<p>Topics covered during this session will include:</p>\\r\\n<p class=\\\"isSelectedEnd\\\"><em>- Mixed-Effects Machine Learning for Predicting Word-Problem Solving and Mathematics Difficulty</em></p>\\r\\n<p class=\\\"isSelectedEnd\\\"><em>- Statistical Meta-analysis to Investigate the Association of SNP (rs4680) in COMT Gene with Multiple Cancers</em></p>\\r\\n<p class=\\\"isSelectedEnd\\\"><em>- Can Protein Language Models (PLMs) Map Viral Evolution?</em></p>\\r\\n<p class=\\\"isSelectedEnd\\\"><em>- Digital Transformation of Performance within Technology-Mediated Learning Environments</em></p>\\r\\n<p class=\\\"isSelectedEnd\\\"><em>- Rareness in Fairness: Mitigating Bias in Group PCA of Functional Neuroimaging</em></p>\\r\\n<p class=\\\"isSelectedEnd\\\"><em>- A Global Transcriptomic Framework for Accurate Modeling of Mycobacterium Tuberculosis Infection</em></p>\\r\\n<p><em>- Persistence Across Domains of Life: A Comparative Genomic Approach to Mycobacterium abscessus and Human Homologs</em></p>\\r\\n<p>Open to faculty, researchers, and students from all colleges, the event is collaboratively by hosted&nbsp;Georgia State University&rsquo;s&nbsp;<em>Advanced Research Computing Technology, Innovation &amp; Collaboration (ARCTIC)</em>&nbsp;core and Kennesaw State University&rsquo;s <em>Center for Research Computing</em>.&nbsp;The conference provides researchers a venue to present research, brainstorm new ideas with colleagues, learn how to approach today&rsquo;s multidisciplinary computational challenges and take advantage of state-of-the-art tools and technologies.&nbsp;Get an up-close look at the field of scientific computing and discover the latest innovations in research with researchers from across universities.</p>\\r\\n<p><em>Coffee and light pastries served.</em></p>\",\"location\":\"Centennial Hall Auditorium\",\"startsOn\":\"2026-09-22T13:00:00+00:00\",\"endsOn\":\"2026-09-22T13:30:00+00:00\",\"imagePath\":\"2d759223-ed97-4f78-9938-1200a0f7d90900a81ce7-b1f1-46b0-81e2-9822dd8e2cd7.png\",\"theme\":\"ThoughtfulLearning\",\"categoryIds\":[\"8776\"],\"categoryNames\":[\"*Atlanta Campus\"],\"benefitNames\":[\"Free Food\"],\"visibility\":\"Institution\",\"status\":\"Approved\",\"latitude\":\"33.756140\",\"longitude\":\"-84.383740\",\"recScore\":null,\"rsvpTotal\":1,\"@search.score\":99.27149},{\"id\":\"12750521\",\"institutionId\":5435,\"organizationId\":418713,\"organizationIds\":[\"323474\",\"331247\",\"418713\",\"425942\"],\"branchId\":303704,\"branchIds\":[\"303704\",\"178668\"],\"organizationName\":\"Research Computing/ARCTIC\",\"organizationProfilePicture\":\"3208d888-b1ca-487e-adfb-0d9b7ca3986d37f72700-7ffd-4fbd-9ffa-4fbf252dd78b.png\",\"organizationNames\":[\"Instructional Innovation & Technology\",\"POUNCE Rewards Program\",\"Research Computing/ARCTIC\",\"Community of Students in Math, Innovation, and Computing \"],\"name\":\"Leveraging Mobile Technology for Longitudinal Data Collection in a Mindfulness Intervention for Refugee and Immigrant Communities - SCD Conference Session\",\"description\":\"<p>Engage with&nbsp;<strong>Dr.&nbsp;Ashli Owen-Smith</strong>, Professor, Health Policy &amp; Behavioral Sciences; <strong>Dr. Erin Weeks</strong>, MC Centers for Healthy Dev URC,&nbsp; Georgia State University on their study related to&nbsp;<strong>Leveraging Mobile Technology for Longitudinal Data Collection in a Mindfulness Intervention for Refugee and Immigrant Communities.</strong></p>\\r\\n<p>&nbsp;</p>\\r\\n<p>Social isolation and loneliness (SIL) are increasingly recognized as significant public health concerns, with refugee, immigrant, and migrant (RIM) communities experiencing elevated risk due to factors such as language barriers, cultural adjustment, and limited social support networks. While mindfulness-based interventions (MBIs) have demonstrated effectiveness in reducing SIL, few studies have systematically adapted these interventions to address the cultural and linguistic needs of diverse RIM populations.</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>This study seeks to identify culturally and linguistically responsive adaptations to a mindfulness- based intervention for a RIM community in Clarkston, Georgia, often referred to as the &ldquo;most diverse square mile in America.&rdquo; As part of a larger mixed-methods study, researchers collaborated with GSU&rsquo;s ARCTIC team to develop a mobile application to support participant engagement and collect longitudinal data throughout the intervention. The application is used to capture utilization of guided meditation recordings and participant self-reports of their usefulness.</p>\\r\\n<p><br />This presentation will focus on the study's data collection infrastructure and the role of mobile technology in supporting community-based behavioral health research. We will describe the measures collected across multiple time points, discuss the advantages and challenges of app-based data collection with linguistically diverse populations, and highlight how digital tools can facilitate the collection of longitudinal research data in community settings. Preliminary lessons learned will inform future efforts to leverage mobile technologies in culturally responsive intervention research with refugee, immigrant, and migrant communities.</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>This event is part of the&nbsp;<a href=\\\"https://arctic.gsu.edu/training/scd/\\\">Science and Cyberinfrastructure for Discovery</a>&nbsp;(SCD) conference. Open to faculty, researchers, and students from all colleges, the event is collaboratively by hosted&nbsp;<strong>Georgia State University&rsquo;s&nbsp;<em>Advanced Research Computing Technology, Innovation &amp; Collaboration (ARCTIC)</em></strong>&nbsp;core and <strong>Kennesaw State University&rsquo;s <em>Center for Research Computing</em></strong>.&nbsp;The conference provides researchers a venue to present research, brainstorm new ideas with colleagues, learn how to approach today&rsquo;s multidisciplinary computational challenges and take advantage of state-of-the-art tools and technologies.&nbsp;</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>Get an up-close look at the field of scientific computing and discover the latest innovations in research with researchers from across universities. Build new connections. Learn new methods and techniques&nbsp;you can apply in your research.</p>\",\"location\":\"Centennial Hall Auditorium\",\"startsOn\":\"2026-09-22T14:00:00+00:00\",\"endsOn\":\"2026-09-22T14:30:00+00:00\",\"imagePath\":\"d3568342-4631-40fe-8318-959acb11ceccb4325d6a-dd33-40da-8b8d-50a7199b2c23.png\",\"theme\":\"ThoughtfulLearning\",\"categoryIds\":[],\"categoryNames\":[],\"benefitNames\":[],\"visibility\":\"Institution\",\"status\":\"Approved\",\"latitude\":\"33.756140\",\"longitude\":\"-84.383740\",\"recScore\":null,\"rsvpTotal\":0,\"@search.score\":99.267},{\"id\":\"12752633\",\"institutionId\":5435,\"organizationId\":418713,\"organizationIds\":[\"323474\",\"331247\",\"418713\",\"425942\"],\"branchId\":303704,\"branchIds\":[\"303704\",\"178668\"],\"organizationName\":\"Research Computing/ARCTIC\",\"organizationProfilePicture\":\"3208d888-b1ca-487e-adfb-0d9b7ca3986d37f72700-7ffd-4fbd-9ffa-4fbf252dd78b.png\",\"organizationNames\":[\"Instructional Innovation & Technology\",\"POUNCE Rewards Program\",\"Research Computing/ARCTIC\",\"Community of Students in Math, Innovation, and Computing \"],\"name\":\"Generative AI and Firm Hiring Demand: Evidence from Advanced and Developing Economies - SCD Conference Session\",\"description\":\"<p>Engage with<strong> Dr. Elaine Lui, </strong>Professor, Faezeh Khosravi, Ph.D Student, Department of Economics,&nbsp;Georgia State University durimg a presentationon&nbsp;<em>Generative AI and Firm Hiring Demand: Evidence from Advanced and Developing Economies.</em></p>\\r\\n<p>&nbsp;</p>\\r\\n<p>We study how the release of ChatGPT affected firms&rsquo; hiring demand across 200 economies, using 115.9 million online job postings from 43,000 firm-country pairs. We find that firms more exposed to AI substitution reduced both their overall posting volumes and the share of vacancies for highly substitutable occupations. These changes grew steadily during the three years following ChatGPT&rsquo;s release. Within multinational firms, hiring composition changed similarly across advanced- and developing-economy operations, suggesting a centralized firm-level response, although posting volumes declined more sharply in developing economies. Overall, the findings indicate that generative AI is reshaping hiring demand primarily through changes in the composition of vacancies.</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>This event is part of the&nbsp;<a href=\\\"https://arctic.gsu.edu/training/scd/\\\">Science and Cyberinfrastructure for Discovery</a>&nbsp;(SCD) conference. Open to faculty, researchers, and students from all colleges, the event is collaboratively by hosted&nbsp;<strong>Georgia State University&rsquo;s&nbsp;<em>Advanced Research Computing Technology, Innovation &amp; Collaboration (ARCTIC)</em></strong>&nbsp;core and <strong>Kennesaw State University&rsquo;s <em>Center for Research Computing</em></strong>.&nbsp;The conference provides researchers a venue to present research, brainstorm new ideas with colleagues, learn how to approach today&rsquo;s multidisciplinary computational challenges and take advantage of state-of-the-art tools and technologies.&nbsp;</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>Get an up-close look at the field of scientific computing and discover the latest innovations in research with researchers from across universities. Build new connections. Learn new methods and techniques&nbsp;you can apply in your research.</p>\",\"location\":\"Centennial Hall Auditorium\",\"startsOn\":\"2026-09-22T18:00:00+00:00\",\"endsOn\":\"2026-09-22T18:30:00+00:00\",\"imagePath\":\"75fab290-7abd-44d8-8465-9fe6fd6f17825d6fab99-4704-4455-83c4-fd22cd833790.png\",\"theme\":\"ThoughtfulLearning\",\"categoryIds\":[\"8776\"],\"categoryNames\":[\"*Atlanta Campus\"],\"benefitNames\":[],\"visibility\":\"Institution\",\"status\":\"Approved\",\"latitude\":\"33.756140\",\"longitude\":\"-84.383740\",\"recScore\":null,\"rsvpTotal\":0,\"@search.score\":99.24902},{\"id\":\"12752716\",\"institutionId\":5435,\"organizationId\":418713,\"organizationIds\":[\"323474\",\"331247\",\"418713\",\"425942\"],\"branchId\":303704,\"branchIds\":[\"303704\",\"178668\"],\"organizationName\":\"Research Computing/ARCTIC\",\"organizationProfilePicture\":\"3208d888-b1ca-487e-adfb-0d9b7ca3986d37f72700-7ffd-4fbd-9ffa-4fbf252dd78b.png\",\"organizationNames\":[\"Instructional Innovation & Technology\",\"POUNCE Rewards Program\",\"Research Computing/ARCTIC\",\"Community of Students in Math, Innovation, and Computing \"],\"name\":\"Development of Comprehensive Mathematical Models of Mouse Cardiac Myocytes - SCD Conference Session\",\"description\":\"<p>Engage with&nbsp;<strong>Dr. Vladimir Bondarenko,&nbsp;</strong>Associate Professor, Mathematics and Statistics, Neuroscience Institute, Georgia State University at a conference presentation session on&nbsp;<em><strong>Development of Comprehensive Mathematical Models of Mouse Cardiac Myocytes</strong></em>.</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>Mathematical modeling of cardiac myocytes is considered an auxiliary research method in cardiology along with the experimental investigations and clinical studies. In particular, the mouse is a species that is most used in experimental studies of cardiovascular diseases due to its ability of relatively easy to adopt genetic transformations. Therefore, it is important to develop mathematical models of mouse cardiac myocytes, tissues, and the whole heart to simulate electrical activity, ionic dynamics, and myocyte contractions, as well as their regulation by protein signaling networks. This presentation will provide a description of several mathematical models of mouse cardiac myocytes that simulate multiple experimental results on action potential generation and propagation, calcium dynamics, contraction force, and myocyte shortening, obtained both from normal and diseased mouse hearts. Attention is paid to simulations of the effects of &beta;1- and &beta;2-adrenergic signaling on mouse cardiac myocyte behavior.</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>This event is part of the&nbsp;<a href=\\\"https://arctic.gsu.edu/training/scd/\\\">Science and Cyberinfrastructure for Discovery</a>&nbsp;(SCD) conference. Open to faculty, researchers, and students from all colleges, the event is collaboratively by hosted&nbsp;<strong>Georgia State University&rsquo;s&nbsp;<em>Advanced Research Computing Technology, Innovation &amp; Collaboration (ARCTIC)</em></strong>&nbsp;core and <strong>Kennesaw State University&rsquo;s <em>Center for Research Computing</em></strong>.&nbsp;The conference provides researchers a venue to present research, brainstorm new ideas with colleagues, learn how to approach today&rsquo;s multidisciplinary computational challenges and take advantage of state-of-the-art tools and technologies.&nbsp;</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>Get an up-close look at the field of scientific computing and discover the latest innovations in research with researchers from across universities. Build new connections. Learn new methods and techniques&nbsp;you can apply in your research.</p>\",\"location\":\"Centennial Hall Auditorium\",\"startsOn\":\"2026-09-22T18:15:00+00:00\",\"endsOn\":\"2026-09-22T18:45:00+00:00\",\"imagePath\":\"f4bb9a5f-478d-4a44-aec6-a0295fdd88d68245323c-3990-4efe-b127-d476a128bc5b.png\",\"theme\":\"ThoughtfulLearning\",\"categoryIds\":[\"8776\"],\"categoryNames\":[\"*Atlanta Campus\"],\"benefitNames\":[],\"visibility\":\"Institution\",\"status\":\"Approved\",\"latitude\":\"33.756140\",\"longitude\":\"-84.383740\",\"recScore\":null,\"rsvpTotal\":0,\"@search.score\":99.247894},{\"id\":\"12736963\",\"institutionId\":5435,\"organizationId\":418713,\"organizationIds\":[\"323474\",\"331247\",\"418713\",\"425942\"],\"branchId\":303704,\"branchIds\":[\"303704\",\"178668\"],\"organizationName\":\"Research Computing/ARCTIC\",\"organizationProfilePicture\":\"3208d888-b1ca-487e-adfb-0d9b7ca3986d37f72700-7ffd-4fbd-9ffa-4fbf252dd78b.png\",\"organizationNames\":[\"Instructional Innovation & Technology\",\"POUNCE Rewards Program\",\"Research Computing/ARCTIC\",\"Community of Students in Math, Innovation, and Computing \"],\"name\":\"Science & Cyberinfrastructure for Discovery Conference - Keynote and Poster Session\",\"description\":\"<p>Hear speaker,&nbsp;<strong>Dr. Vince Calhoun,</strong>&nbsp;Distinguished University Professor, Georgia State University, and Founding Director of the tri-institutional Center for Translational Research in Neuroimaging and Data Science (TReNDS) and meet scientific and computational researchers from across institutions at the&nbsp;<a href=\\\"https://arctic.gsu.edu/training/scd/\\\">Science and Cyberinfrastructure for Discovery</a>&nbsp;(SCD) conference keynote and poster session.</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>Open to faculty, researchers, and students from all colleges, the event is collaboratively by hosted&nbsp;<strong>Georgia State University&rsquo;s&nbsp;<em>Advanced Research Computing Technology, Innovation &amp; Collaboration (ARCTIC)</em></strong>&nbsp;core and <strong>Kennesaw State University&rsquo;s <em>Center for Research Computing</em></strong>.&nbsp;The conference provides researchers a venue to present research, brainstorm new ideas with colleagues, learn how to approach today&rsquo;s multidisciplinary computational challenges and take advantage of state-of-the-art tools and technologies.&nbsp;</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>Get an up-close look at the field of scientific computing and discover the latest innovations in research with researchers from across universities. Build new connections. Learn new methods and techniques&nbsp;you can apply in your research.</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>Drop in for this session or register for the <a href=\\\"https://calendar.gsu.edu/event/science-and-cyberinfrastructure-for-discovery-scd-conference\\\">full conference</a> if you plan to attend multiple conference sessions throughout.</p>\\r\\n<p>&nbsp;</p>\\r\\n<p><em>Light refreshments will be served.</em></p>\",\"location\":\"Centennial Hall - Room 120\",\"startsOn\":\"2026-09-23T07:30:00+00:00\",\"endsOn\":\"2026-09-23T22:00:00+00:00\",\"imagePath\":\"4f67267a-f113-4336-9958-57b71235668623fada9b-59ae-4bfe-9b0c-9c1318235bb6.png\",\"theme\":\"ThoughtfulLearning\",\"categoryIds\":[\"8776\"],\"categoryNames\":[\"*Atlanta Campus\"],\"benefitNames\":[\"Free Food\"],\"visibility\":\"Institution\",\"status\":\"Approved\",\"latitude\":\"33.756140\",\"longitude\":\"-84.383740\",\"recScore\":null,\"rsvpTotal\":4,\"@search.score\":99.18829},{\"id\":\"12753037\",\"institutionId\":5435,\"organizationId\":418713,\"organizationIds\":[\"323474\",\"418713\",\"425942\"],\"branchId\":303704,\"branchIds\":[\"303704\",\"178668\"],\"organizationName\":\"Research Computing/ARCTIC\",\"organizationProfilePicture\":\"3208d888-b1ca-487e-adfb-0d9b7ca3986d37f72700-7ffd-4fbd-9ffa-4fbf252dd78b.png\",\"organizationNames\":[\"Instructional Innovation & Technology\",\"Research Computing/ARCTIC\",\"Community of Students in Math, Innovation, and Computing \"],\"name\":\"Biodiversity Science with Large-Scale Genomic Data\",\"description\":\"<p>Join&nbsp;<strong>Dr. Todd W. Pierson</strong>,&nbsp;Associate Professor of Biology,&nbsp;Department of Ecology, Evolution, and Organismal Biology, Kennesaw State University for a session on&nbsp;<em><strong>Biodiversity science with large-scale genomic data</strong></em>.</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>The advent of large-scale genomic data and computational tools for analyzing them have changed the way that scientists study biodiversity, from the discovery of new species to the inference of evolutionary histories and the relationship between genotype and phenotype. This presentation includes a series of case studies demonstrating the application of genomic data towards a better understanding of the ecology, evolution, and conservation of Appalachian salamanders&mdash;a group of diverse amphibians that make compelling models for biological inquiry.</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>This event is part of the&nbsp;<a href=\\\"https://arctic.gsu.edu/training/scd/\\\">Science and Cyberinfrastructure for Discovery</a>&nbsp;(SCD) conference. Open to faculty, researchers, and students from all colleges, the event is collaboratively by hosted&nbsp;<strong>Georgia State University&rsquo;s&nbsp;<em>Advanced Research Computing Technology, Innovation &amp; Collaboration (ARCTIC)</em></strong>&nbsp;core and <strong>Kennesaw State University&rsquo;s <em>Center for Research Computing</em></strong>.&nbsp;The conference provides researchers a venue to present research, brainstorm new ideas with colleagues, learn how to approach today&rsquo;s multidisciplinary computational challenges and take advantage of state-of-the-art tools and technologies.&nbsp;</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>Get an up-close look at the field of scientific computing and discover the latest innovations in research with researchers from across universities. Build new connections. Learn new methods and techniques&nbsp;you can apply in your research.</p>\",\"location\":\"Centennial Hall Auditorium\",\"startsOn\":\"2026-09-23T15:45:00+00:00\",\"endsOn\":\"2026-09-23T17:15:00+00:00\",\"imagePath\":\"8502a3f3-71f1-4086-8ad5-bfbff95853ceb91f62c0-0d72-43c7-8592-7c01e3dc1385.png\",\"theme\":\"ThoughtfulLearning\",\"categoryIds\":[],\"categoryNames\":[],\"benefitNames\":[],\"visibility\":\"Institution\",\"status\":\"Approved\",\"latitude\":\"33.756140\",\"longitude\":\"-84.383740\",\"recScore\":null,\"rsvpTotal\":0,\"@search.score\":99.15114},{\"id\":\"12753160\",\"institutionId\":5435,\"organizationId\":418713,\"organizationIds\":[\"323474\",\"331247\",\"418713\",\"425942\"],\"branchId\":303704,\"branchIds\":[\"303704\",\"178668\"],\"organizationName\":\"Research Computing/ARCTIC\",\"organizationProfilePicture\":\"3208d888-b1ca-487e-adfb-0d9b7ca3986d37f72700-7ffd-4fbd-9ffa-4fbf252dd78b.png\",\"organizationNames\":[\"Instructional Innovation & Technology\",\"POUNCE Rewards Program\",\"Research Computing/ARCTIC\",\"Community of Students in Math, Innovation, and Computing \"],\"name\":\"Sustainable Research Computing in Practice: On-Prem, Cloud, and Hybrid HPC - Panel at the Science and Cyberinfrastructure for Discovery Conference\",\"description\":\"<p>Engage with a panel of experts on&nbsp;&nbsp;<strong>Sustainable Research Computing in Practice: On-Prem, Cloud, and Hybrid HPC,&nbsp;</strong><em>Balancing performance, cost, scalability, and sustainability in the AI era.</em></p>\\r\\n<p><strong>Panelist will include: Dr. Kevin Gittner</strong>, Assistant Professor of Biostatistics and Research Methodology, the School of Data Science and Analytics &amp; the Department of Health Promotion and Physical Education. Kennesaw State University</p>\\r\\n<p><strong>Dr.&nbsp;</strong><strong>Ryan Parker</strong>, Part-Time Assistant Professor of Biology, Department of Molecular and Cellular Biology,&nbsp;Kennesaw State University</p>\\r\\n<p><strong>Dr. Samer Gozem</strong>,&nbsp;Associate Professor, Department of&nbsp;Chemistry,&nbsp;Georgia State University&nbsp;</p>\\r\\n<p><strong>Dr. Neranjan (Suranga) Edirisinghe</strong>, Director,&nbsp; Research Computing,&nbsp;Georgia State University.&nbsp;</p>\\r\\n<p><strong>Moderator:</strong> <strong>Dr.&nbsp;Ramazan Aygun</strong>,&nbsp;Director, Center for Research Computing,&nbsp;Kennesaw State University</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>This event follows conference lunch. Drop into the panel or <a href=\\\"https://calendar.gsu.edu/event/science-and-cyberinfrastructure-for-discovery-scd-conference\\\">register for the complete conference</a>&nbsp;by Friday, Sept. 18 for lunch before the panel discussion.</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>This event is part of the&nbsp;<a href=\\\"https://arctic.gsu.edu/training/scd/\\\">Science and Cyberinfrastructure for Discovery</a>&nbsp;(SCD) conference. Open to faculty, researchers, and students from all colleges, the event is collaboratively by hosted&nbsp;<strong>Georgia State University&rsquo;s&nbsp;<em>Advanced Research Computing Technology, Innovation &amp; Collaboration (ARCTIC)</em></strong>&nbsp;core and <strong>Kennesaw State University&rsquo;s <em>Center for Research Computing</em></strong>.&nbsp;The conference provides researchers a venue to present research, brainstorm new ideas with colleagues, learn how to approach today&rsquo;s multidisciplinary computational challenges and take advantage of state-of-the-art tools and technologies.&nbsp;</p>\\r\\n<p>&nbsp;</p>\\r\\n<p>Get an up-close look at the field of scientific computing and discover the latest innovations in research with researchers from across universities. Build new connections. Learn new methods and techniques&nbsp;you can apply in your research.</p>\",\"location\":\"Centennial Hall Auditorium\",\"startsOn\":\"2026-09-23T17:00:00+00:00\",\"endsOn\":\"2026-09-23T18:00:00+00:00\",\"imagePath\":\"06f0b5de-0317-4782-bd0b-482838fdb5179ed8f300-0f4f-4dcf-921c-0c980c19b626.png\",\"theme\":\"ThoughtfulLearning\",\"categoryIds\":[\"8776\",\"8784\"],\"categoryNames\":[\"*Atlanta Campus\",\"Speaker/Lecturer\"],\"benefitNames\":[],\"visibility\":\"Institution\",\"status\":\"Approved\",\"latitude\":\"33.756140\",\"longitude\":\"-84.383740\",\"recScore\":null,\"rsvpTotal\":3,\"@search.score\":99.14551}]}"